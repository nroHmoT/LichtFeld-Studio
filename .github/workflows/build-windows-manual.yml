name: Build Lichtfeld Studio (Windows)

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build Configuration (Release or Debug)'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

jobs:
  build-windows:
    name: Build on Windows
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 1. Initialize Visual Studio Developer Environment Variables
      - name: Set up Visual Studio Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 2. Cache LibTorch to avoid mid-download timeouts
      - name: Cache External LibTorch Binaries
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\external
          key: libtorch-windows-cuda-v1-${{ hashFiles('build_lichtfeld.ps1') }}
          restore-keys: |
            libtorch-windows-cuda-v1-

      # 3. Execute Build Script with MSVC and Skip Verification
      - name: Build Lichtfeld Studio
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Print environment paths for build logging
          Write-Host "VSINSTALLDIR: $env:VSINSTALLDIR"
          Write-Host "VCToolsInstallDir: $env:VCToolsInstallDir"

          $params = @{
            Configuration    = "${{ inputs.configuration }}"
            SkipVerification = $true
          }

          if ("${{ inputs.configuration }}" -eq "Release") {
            $params["Clean"] = $true
          }

          & "$env:GITHUB_WORKSPACE\build_lichtfeld.ps1" @params
